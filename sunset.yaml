blueprint:
  name: Sunset light effect
  description: >
    Gradually dims and warms a light toward a target time (sunset style), then
    turns it off. Based on the wake-up sunrise blueprint.
  domain: automation
input:
  light_entity:
    name: Light entity
    selector:
      entity:
        domain: light
  timestamp_sensor:
    name: Target timestamp sensor
    default: none
    selector:
      entity:
        device_class: timestamp
  manual_time:
    name: Manual target time
    default: 19:00:00
    selector:
      time: {}
  check_entity:
    name: Optional check entity
    default: none
    selector:
      entity: {}
  sunset_duration:
    name: Sunset duration
    description: Minutes before target time to start dimming
    default: 25
    selector:
      number:
        min: 5
        max: 90
        step: 1
        unit_of_measurement: min
  start_brightness:
    name: Start brightness
    default: 254
    selector:
      number:
        min: 1
        max: 255
  end_brightness:
    name: End brightness
    default: 1
    selector:
      number:
        min: 0
        max: 255
  pre_sunset_actions:
    name: Pre-sunset actions
    default: []
    selector:
      action: {}
  post_sunset_actions:
    name: Post-sunset actions
    default: []
    selector:
      action: {}
variables:
  light_entity: light_entity
  sensor: timestamp_sensor
  manual_time: manual_time
  duration: sunset_duration
  start_brightness: start_brightness
  end_brightness: end_brightness
  range_brightness: "{{ start_brightness - end_brightness }}"
  seconds: "{{ duration * 60 }}"
  tick_time: |
    {{ (seconds / range_brightness) if range_brightness > 0 else 1 }}
  check_entity: check_entity
trigger:
  - platform: time_pattern
    minutes: "*"
condition: []
action:
  - wait_template: |
      {{ sensor == 'none'
         or as_timestamp(states(sensor), none) != none }}
  - wait_template: |
      {{
        0 <
        (
          as_timestamp(
            states(sensor)
            if sensor != 'none'
            else states('sensor.date') ~ ' ' ~ manual_time
          )
          - as_timestamp(states('sensor.date_time_iso'))
        )
        <= seconds
        and (
          check_entity == 'none'
          or states(check_entity) in ['on', 'home', 'unknown']
        )
      }}
  - choose:
      - conditions: []
        sequence: pre_sunset_actions
  - service: light.turn_on
    target:
      entity_id: light_entity
    data:
      brightness: "{{ start_brightness }}"
  - repeat:
      while:
        - condition: template
          value_template: |
            {{
              0 <
              (
                as_timestamp(
                  states(sensor)
                  if sensor != 'none'
                  else states('sensor.date') ~ ' ' ~ manual_time
                )
                - as_timestamp(now())
              )
              <= seconds
            }}
      sequence:
        - delay:
            seconds: "{{ tick_time | int(1) }}"
        - service: light.turn_on
          target:
            entity_id: light_entity
          data:
            brightness: |
              {{
                (
                  start_brightness
                  - (
                      range_brightness
                      * (
                          (
                            as_timestamp(
                              states(sensor)
                              if sensor != 'none'
                              else states('sensor.date') ~ ' ' ~ manual_time
                            )
                            - as_timestamp(now())
                          )
                          / seconds
                        )
                    )
                ) | int
              }}
  - service: light.turn_off
    target:
      entity_id: light_entity
  - choose:
      - conditions: []
        sequence: post_sunset_actions
mode: single
